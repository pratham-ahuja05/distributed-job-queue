<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #475569; }
      .m { font-family: ui-monospace, 'SF Mono', Consolas, monospace; font-size: 11.5px; fill: #1e293b; }
      .lbl { font-size: 12px; fill: #1e293b; font-weight: 600; }
      .lbl2 { font-size: 11.5px; fill: #475569; }
      .num { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .flow { stroke: #2a78d6; stroke-width: 2; fill: none; }
      .plain { stroke: #475569; stroke-width: 1.6; fill: none; }
      .muted { stroke: #94a3b8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0.5" y="0.5" width="1199" height="759" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ===== column A: edge + API ===== -->
  <rect x="32" y="40" width="230" height="64" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="66" class="t">Browser</text>
  <text x="50" y="87" class="s">React dashboard · curl / clients</text>

  <rect x="32" y="150" width="230" height="72" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="50" y="176" class="t">nginx</text>
  <text x="50" y="196" class="s">serves UI · proxies /api, /grafana</text>
  <text x="50" y="212" class="s">SSE unbuffered · actuator hidden</text>

  <rect x="32" y="270" width="230" height="200" rx="10" fill="#eff6ff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="50" y="298" class="t">api-service</text>
  <text x="50" y="316" class="s">Spring Boot 3 · JPA · Flyway</text>
  <text x="50" y="344" class="m">POST /api/jobs, /jobs/batch</text>
  <text x="50" y="362" class="m">POST /api/dlq/{id}/redrive</text>
  <text x="50" y="380" class="m">GET  /api/stream  (SSE)</text>
  <text x="50" y="398" class="m">GET  /api/stats/runs/{type}</text>
  <text x="50" y="428" class="s">validation · per-IP rate limit</text>
  <text x="50" y="446" class="s">backlog cap · retention</text>

  <path d="M147 104 V146" class="plain" marker-end="url(#a)"/>
  <path d="M147 222 V266" class="plain" marker-end="url(#a)"/>

  <!-- ===== column B: Redis ===== -->
  <rect x="400" y="40" width="380" height="300" rx="12" fill="#fef2f2" stroke="#e34948" stroke-width="1.5"/>
  <text x="420" y="68" class="t">Redis 7</text>
  <text x="488" y="68" class="s">dispatch only · IDs, never state</text>

  <text x="420" y="98" class="lbl2">priority queues</text>
  <rect x="420" y="106" width="340" height="24" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="432" y="122" class="m">queue:high</text>
  <rect x="628" y="111" width="22" height="14" rx="3" fill="#e34948"/><rect x="654" y="111" width="22" height="14" rx="3" fill="#e34948"/>
  <rect x="420" y="134" width="340" height="24" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="432" y="150" class="m">queue:medium</text>
  <rect x="628" y="139" width="22" height="14" rx="3" fill="#e34948" opacity=".75"/><rect x="654" y="139" width="22" height="14" rx="3" fill="#e34948" opacity=".75"/><rect x="680" y="139" width="22" height="14" rx="3" fill="#e34948" opacity=".75"/>
  <rect x="420" y="162" width="340" height="24" rx="5" fill="#fff" stroke="#fca5a5"/>
  <text x="432" y="178" class="m">queue:low</text>
  <rect x="628" y="167" width="22" height="14" rx="3" fill="#e34948" opacity=".5"/><rect x="654" y="167" width="22" height="14" rx="3" fill="#e34948" opacity=".5"/><rect x="680" y="167" width="22" height="14" rx="3" fill="#e34948" opacity=".5"/><rect x="706" y="167" width="22" height="14" rx="3" fill="#e34948" opacity=".5"/>

  <text x="420" y="212" class="m">processing:{workerId}</text>
  <text x="590" y="212" class="lbl2">in-flight IDs per thread</text>
  <text x="420" y="234" class="m">worker:{workerId}</text>
  <text x="590" y="234" class="lbl2">liveness hash, 10 s TTL</text>
  <text x="420" y="256" class="m">queue:dead_letter</text>
  <text x="590" y="256" class="lbl2">retries exhausted</text>
  <text x="420" y="278" class="m">events:jobs</text>
  <text x="590" y="278" class="lbl2">pub/sub → live dashboard</text>
  <text x="420" y="300" class="m">settings:failure_rate</text>
  <text x="590" y="300" class="lbl2">demo fault injection</text>
  <text x="420" y="322" class="m">chaos:crash</text>
  <text x="590" y="322" class="lbl2">demo: halt a worker JVM</text>

  <!-- ===== column B: Postgres ===== -->
  <rect x="400" y="400" width="380" height="250" rx="12" fill="#eef4fd" stroke="#256abf" stroke-width="1.5"/>
  <text x="420" y="428" class="t">PostgreSQL 15</text>
  <text x="535" y="428" class="s">source of truth</text>
  <text x="420" y="456" class="lbl2">jobs</text>
  <text x="420" y="476" class="m">id · type · payload · priority</text>
  <text x="420" y="494" class="m">status  QUEUED|PROCESSING|RETRYING|SUCCESS|DLQ</text>
  <text x="420" y="512" class="m">retry_count · max_retries · next_retry_at</text>
  <text x="420" y="530" class="m">worker_id · heartbeat_at · attempts</text>
  <text x="420" y="558" class="lbl2">composite indexes</text>
  <text x="420" y="578" class="m">(status, next_retry_at)     retry scheduler</text>
  <text x="420" y="596" class="m">(status, heartbeat_at)      recovery reaper</text>
  <text x="420" y="614" class="m">(status, priority, created) orphan sweep</text>
  <text x="420" y="632" class="m">(type, status)              run statistics</text>

  <!-- ===== column C: workers ===== -->
  <rect x="900" y="40" width="268" height="250" rx="12" fill="#ecfdf5" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="918" y="68" class="t">worker container</text>
  <text x="918" y="86" class="s">× N replicas (Compose --scale)</text>
  <g>
    <rect x="918" y="100" width="112" height="40" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="930" y="125" class="m">thread t0</text>
    <rect x="1038" y="100" width="112" height="40" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="1050" y="125" class="m">thread t1</text>
    <rect x="918" y="146" width="112" height="40" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="930" y="171" class="m">thread t2</text>
    <rect x="1038" y="146" width="112" height="40" rx="7" fill="#fff" stroke="#6ee7b7"/><text x="1050" y="171" class="m">thread t3</text>
  </g>
  <text x="918" y="212" class="s">pop → claim → execute → record → ack</text>
  <line x1="918" y1="226" x2="1150" y2="226" stroke="#a7f3d0"/>
  <text x="918" y="246" class="lbl2">heartbeat thread (every 2 s)</text>
  <text x="918" y="264" class="lbl2">retry scheduler (SKIP LOCKED)</text>
  <text x="918" y="282" class="lbl2">recovery reaper (SKIP LOCKED)</text>

  <rect x="912" y="302" width="268" height="40" rx="12" fill="#ecfdf5" stroke="#1baf7a" stroke-dasharray="5 4"/>
  <text x="930" y="327" class="s">worker container #2 … identical</text>

  <!-- ===== observability ===== -->
  <rect x="900" y="470" width="268" height="70" rx="10" fill="#fff7ed" stroke="#eb6834"/>
  <text x="918" y="496" class="t">Prometheus</text>
  <text x="918" y="516" class="s">scrapes /actuator/prometheus</text>
  <text x="918" y="532" class="s">DNS discovery of all replicas</text>
  <rect x="900" y="580" width="268" height="70" rx="10" fill="#fff7ed" stroke="#eb6834"/>
  <text x="918" y="606" class="t">Grafana</text>
  <text x="918" y="626" class="s">throughput · p50/p95/p99 · queue</text>
  <text x="918" y="642" class="s">depth · recoveries · busy threads</text>
  <path d="M1034 540 V576" class="plain" marker-end="url(#a)"/>

  <!-- ===== flows ===== -->
  <!-- 1: API -> Postgres insert -->
  <path d="M262 440 C330 440 340 470 396 470" class="flow" marker-end="url(#ab)"/>
  <circle cx="300" cy="449" r="10" fill="#2a78d6"/><text x="296.5" y="453" class="num">1</text>
  <text x="270" y="482" class="lbl">INSERT + commit</text>

  <!-- 2: API -> Redis LPUSH -->
  <path d="M262 300 H318 V140 H396" class="flow" marker-end="url(#ab)"/>
  <circle cx="318" cy="212" r="10" fill="#2a78d6"/><text x="314.5" y="216" class="num">2</text>
  <text x="328" y="244" class="lbl">LPUSH id</text>
  <text x="328" y="260" class="lbl2">post-commit</text>

  <!-- 3: worker pops from Redis -->
  <path d="M896 120 H784" class="flow" marker-end="url(#ab)"/>
  <circle cx="840" cy="120" r="10" fill="#2a78d6"/><text x="836.5" y="124" class="num">3</text>
  <text x="796" y="100" class="lbl">Lua pop 6:3:1</text>
  <text x="796" y="146" class="lbl2">→ processing list</text>

  <!-- 4: worker claims in Postgres -->
  <path d="M912 322 C846 322 846 500 784 500" class="flow" marker-end="url(#ab)"/>
  <circle cx="874" cy="382" r="10" fill="#2a78d6"/><text x="870.5" y="386" class="num">4</text>
  <text x="890" y="380" class="lbl">claim: UPDATE … WHERE</text>
  <text x="890" y="396" class="lbl">status='QUEUED'</text>
  <circle cx="874" cy="428" r="10" fill="#2a78d6"/><text x="870.5" y="432" class="num">5</text>
  <text x="890" y="426" class="lbl">result, fenced on</text>
  <text x="890" y="442" class="lbl">worker_id + status</text>

  <!-- 5: result fenced -->
  
  <!-- 6: ack + event back to Redis -->
  <path d="M896 250 C850 250 830 270 784 270" class="flow" marker-end="url(#ab)"/>
  <circle cx="840" cy="262" r="10" fill="#2a78d6"/><text x="836.5" y="266" class="num">6</text>
  <text x="796" y="296" class="lbl2">ack + event</text>

  <!-- 7: events -> API -> SSE -->
  <path d="M398 290 C340 330 320 360 266 360" class="muted" marker-end="url(#am)"/>
  <circle cx="330" cy="342" r="10" fill="#64748b"/><text x="326.5" y="346" class="num">7</text>

  <!-- metrics scrape -->
  <path d="M1168 160 C1190 160 1190 505 1170 505" class="muted" marker-end="url(#am)"/>
  <path d="M32 400 H16 V700 H1034 V654" class="muted" marker-end="url(#am)"/>
  <text x="560" y="692" class="lbl2">metrics scraped every 5 s</text>

  <!-- legend -->
  <g transform="translate(32,512)">
    <rect width="230" height="160" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="16" y="24" class="lbl">Job path</text>
    <text x="16" y="44" class="lbl2">1  commit row in Postgres</text>
    <text x="16" y="61" class="lbl2">2  push its ID to a priority list</text>
    <text x="16" y="78" class="lbl2">3  atomic pop into own list</text>
    <text x="16" y="95" class="lbl2">4  claim (exactly one winner)</text>
    <text x="16" y="112" class="lbl2">5  SUCCESS / RETRYING / DLQ</text>
    <text x="16" y="129" class="lbl2">6  ack, publish event</text>
    <text x="16" y="146" class="lbl2">7  events → SSE → dashboard</text>
  </g>
</svg>
