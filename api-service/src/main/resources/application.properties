spring.application.name=api-service
server.port=8080
server.shutdown=graceful

spring.datasource.url=jdbc:postgresql://localhost:5432/jobqueue
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=10

# Flyway owns the schema; Hibernate only checks the entity matches it.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.jackson.serialization.write-dates-as-timestamps=false
spring.mvc.async.request-timeout=-1

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Demo guard rails (overridden per environment)
app.max-batch-size=1000
app.max-backlog=50000
app.rate-limit-per10s=0
app.retention-minutes=0
app.chaos-cooldown-seconds=20
