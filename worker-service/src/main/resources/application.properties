spring.application.name=worker-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/jobqueue
spring.datasource.username=postgres
spring.datasource.password=password
# one connection per worker thread + schedulers/heartbeat
spring.datasource.hikari.maximum-pool-size=10

spring.data.redis.host=localhost
spring.data.redis.port=6379

# heartbeat, retry scheduler and recovery each get their own scheduling thread
spring.task.scheduling.pool.size=3

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

worker.concurrency=4
worker.idle-sleep-ms=100
worker.heartbeat-interval-ms=2000
worker.stale-after-seconds=15
worker.registry-ttl-seconds=10
worker.retry-base-delay-ms=1000
worker.retry-max-delay-ms=60000
worker.default-duration-ms=500
worker.sweep-batch-size=100
worker.orphan-after-seconds=30
worker.chaos-enabled=false
